# ============================================================
# docker-compose.yaml
# 用途：在 Windows Docker Desktop 中建立
#       Ollama(TAIDE) + Qdrant + FastAPI RAG 的完整環境
# ============================================================

services:

  # ----------------------------------------------------------
  # 1. Ollama 服務
  # ----------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - "C:/yourpath/my_AI_rag_container/ollama_models:/root/.ollama"
    restart: unless-stopped
    command: ["serve"]

    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ----------------------------------------------------------
  # 2. prepare-models：一次性下載 TAIDE 與 embedding 模型
  # ----------------------------------------------------------
  prepare-models:
    image: ollama/ollama:latest
    container_name: prepare-models

    depends_on:
      ollama:
        condition: service_healthy

    volumes:
      - "C:/yourpath/my_AI_rag_container/ollama_models:/root/.ollama"

    environment:
      - OLLAMA_HOST=http://ollama:11434

    entrypoint: >
      sh -c "
      echo 'Pulling TAIDE...' &&
      ollama pull cwchang/llama3-taide-lx-8b-chat-alpha1:latest &&
      echo 'Pulling embedding model...' &&
      ollama pull mxbai-embed-large &&
      echo 'Model preparation complete.'
      "

    restart: "no"

  # ----------------------------------------------------------
  # 3. Qdrant 向量資料庫
  # ----------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - "C:/yourpath/my_AI_rag_container/qdrant_storage:/qdrant/storage"
    restart: unless-stopped

  # ----------------------------------------------------------
  # 4. rag-api：FastAPI RAG 服務
  # ----------------------------------------------------------
  rag-api:
    build: ./app
    container_name: rag-api
    ports:
      - "8000:8000"

    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
      prepare-models:
        condition: service_completed_successfully

    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - LLM_MODEL=cwchang/llama3-taide-lx-8b-chat-alpha1:latest
      - EMBEDDING_MODEL=mxbai-embed-large

    volumes:
      - "C:/yourpath/my_AI_rag_container/app:/app"

    restart: unless-stopped 
